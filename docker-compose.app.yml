name: smartschool-app

services:
  identity-api:
    build:
      context: .
      dockerfile: src/SmartSchool.Identity.Api/Dockerfile
    image: smartschool/identity-api:local
    container_name: smartschool-identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SmartSchool: "Host=host.docker.internal;Port=5432;Database=smartschool;Username=postgres;Password=${POSTGRES_PASSWORD}"
      SmartSchoolApiClient__ClientSecret: "${IDENTITY_CLIENT_SECRET}"
      LoginApiClient__ClientId: "smartschool-login-api"
      LoginApiClient__ClientSecret: "${IDENTITY_LOGIN_SECRET}"
      LoginApiClient__TokenEndpoint: "http://127.0.0.1:8080/connect/token"
      BootstrapSuperAdmin__Password: "${SUPERADMIN_PASSWORD}"
      DuendeIdentityServer__IssuerUri: "${IDENTITY_PUBLIC_ISSUER}"
      InternalApiAuthentication__Authority: "${IDENTITY_INTERNAL_URL}"
      InternalApiAuthentication__RequiredScope: "${IDENTITY_MANAGEMENT_SCOPE}"
      InternalApiAuthentication__RequireHttpsMetadata: "false"
    ports:
      - "7101:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  smartschool-api:
    build:
      context: .
      dockerfile: src/SmartSchool.Api/Dockerfile
    image: smartschool/api:local
    container_name: smartschool-api
    depends_on:
      - identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=host.docker.internal;Port=5432;Database=smartschool;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__SmartSchool: "Host=host.docker.internal;Port=5432;Database=smartschool;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "host.docker.internal:6379"
      Kafka__BootstrapServers: "host.docker.internal:9092"
      AI__Provider: "Ollama"
      AI__Ollama__BaseUrl: "http://host.docker.internal:11434"
      AI__Ollama__ChatModel: "llama3.2"
      AI__Ollama__EmbeddingModel: "nomic-embed-text"
      AI__Ollama__TopK: "5"
      Identity__Authority: "${IDENTITY_INTERNAL_URL}"
      Identity__MetadataAddress: "${IDENTITY_INTERNAL_URL}/.well-known/openid-configuration"
      Identity__ValidIssuer: "${IDENTITY_PUBLIC_ISSUER}"
      Identity__Audience: "smartschool-api"
      Identity__RequireHttpsMetadata: "false"
      IdentityService__BaseUrl: "${IDENTITY_INTERNAL_URL}"
      IdentityService__ClientId: "${IDENTITY_CLIENT_ID}"
      IdentityService__ClientSecret: "${IDENTITY_CLIENT_SECRET}"
      IdentityService__Scope: "${IDENTITY_MANAGEMENT_SCOPE}"
    ports:
      - "7001:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
